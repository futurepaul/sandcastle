# sandcastle: Cloudflare's container API on libkrun microVMs (README.md).
# Versions are pinned exactly; each was vetted when it came in
# (docs/krun-spike.md, Dependencies).
[workspace]
resolver = "2"
members = ["crates/wire", "crates/vm", "crates/guest", "crates/rootfs", "crates/egress", "crates/engine", "crates/node", "crates/krun-spike"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
sandcastle-wire = { path = "crates/wire" }
sandcastle-vm = { path = "crates/vm" }
sandcastle-rootfs = { path = "crates/rootfs" }
sandcastle-egress = { path = "crates/egress" }
sandcastle-engine = { path = "crates/engine" }
sandcastle-node = { path = "crates/node" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
hex = "=0.4.3"
hmac = "=0.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
# libc for namespaces, dlopen, vsock, and seccomp; the guest's layer
# decoders, pure Rust so the guest links statically against musl.
libc = "=0.2.189"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
ruzstd = "=0.9.0"
rcgen = "=0.14.10"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "sync", "signal", "fs"] }
# the node's exec over a WebSocket (docs/node.md)
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
url = "=2.5.8"
webpki-roots = "=1.0.9"

# The seatbelt stays on: a failed assertion takes the whole process down,
# never one task of it while the rest carries on.
[profile.dev]
panic = "abort"

[profile.release]
strip = true
overflow-checks = true
panic = "abort"
