# sandcastle: self-hosted computers (docs/sandbox.md in fragment-next).
# A workspace of its own that depends on nothing in fragment-next, so it can
# move to Finite unchanged. Versions are the ones fragment-next's lockfile
# already vetted where they overlap; new ones passed the two-week cooldown.
[workspace]
resolver = "2"
members = ["crates/proto", "crates/nip98", "crates/core", "crates/node", "crates/sandcastled", "crates/cli"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
sandcastle-proto = { path = "crates/proto" }
sandcastle-nip98 = { path = "crates/nip98" }
sandcastle-core = { path = "crates/core" }
sandcastle-node = { path = "crates/node" }
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive", "env"] }
hex = "=0.4.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rcgen = "=0.14.10"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "sync", "signal", "fs"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
url = "=2.5.8"
webpki-roots = "=1.0.9"

# The seatbelt stays on, and a failed assertion takes the whole node down
# (systemd restarts it; its machines keep running), never one task of it
# while the rest carries on.
[profile.dev]
panic = "abort"

[profile.release]
strip = true
overflow-checks = true
panic = "abort"
