# sandcastle: Cloudflare's container API on libkrun microVMs (README.md).
# Versions are pinned exactly; each was vetted when it came in
# (docs/krun-spike.md, Dependencies).
[workspace]
resolver = "2"
members = ["crates/wire", "crates/vm", "crates/guest", "crates/rootfs", "crates/egress", "crates/engine", "crates/node", "crates/fake-engine", "crates/docker-engine", "crates/docker-relay", "crates/krun-spike", "crates/nitro-attest", "crates/session", "crates/forward"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
sandcastle-wire = { path = "crates/wire" }
sandcastle-vm = { path = "crates/vm" }
sandcastle-rootfs = { path = "crates/rootfs" }
sandcastle-egress = { path = "crates/egress" }
sandcastle-engine = { path = "crates/engine" }
sandcastle-nitro-attest = { path = "crates/nitro-attest" }
sandcastle-session = { path = "crates/session" }
sandcastle-forward = { path = "crates/forward" }
sandcastle-node = { path = "crates/node" }
sandcastle-fake-engine = { path = "crates/fake-engine" }
sandcastle-docker-engine = { path = "crates/docker-engine" }
sandcastle-docker-relay = { path = "crates/docker-relay" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
hex = "=0.4.3"
hmac = "=0.13.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
# libc for namespaces, dlopen, vsock, and seccomp; the guest's layer
# decoders, pure Rust so the guest links statically against musl.
libc = "=0.2.191"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
ruzstd = "=0.9.1"
rcgen = "=0.14.10"
# The Nitro attestation verifier's: ring for SHA-256 and the COSE key,
# webpki for the certificate chain, both already in the lock through
# rustls; time for its tests' certificates, already there through rcgen.
ring = "=0.17.14"
rustls-pki-types = { version = "=1.16.0", features = ["std"] }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["ring", "std"] }
time = "=0.3.55"
# The attested session's Noise (crates/session): pure Rust, for the
# guest's static musl build. Not its `std`, which turns ring on.
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "sync", "signal", "fs"] }
# the node's exec over a WebSocket (docs/node.md)
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
url = "=2.5.8"
webpki-roots = "=1.0.12"

# The seatbelt stays on: a failed assertion takes the whole process down,
# never one task of it while the rest carries on.
[profile.dev]
panic = "abort"

[profile.release]
strip = true
overflow-checks = true
panic = "abort"
