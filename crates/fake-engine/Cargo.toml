[package]
name = "sandcastle-fake-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A FAKE engine, a lower-rung test double for the node (docs/node.md, The uplink, Evidence): the engine's API on unix sockets with no VMs and nothing isolated. Containers are records; exec echoes stdin; a guest port is a local HTTP and WebSocket echo server, handed over on ports.sock; a guest's request goes through its intercepts to the handler. Never a node's engine: it runs nothing it is asked to."

[[bin]]
name = "sandcastle-fake-engine"
path = "src/main.rs"

[dependencies]
sandcastle-engine.workspace = true
sandcastle-egress.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
