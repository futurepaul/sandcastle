[package]
name = "sandcastle-nip98"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NIP-98 HTTP auth (kind 27235): verify on the daemon, sign in clients."

[features]
# Signing plus key generation, which needs the OS's randomness.
sign = ["dep:rand_core"]

[dependencies]
base64.workspace = true
hex.workspace = true
k256.workspace = true
rand_core = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
