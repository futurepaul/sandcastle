[package]
name = "sandcastle-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A microVM guest's init and agent: one static binary (x86_64- or aarch64-unknown-linux-musl) that mounts the root, runs the entrypoint as its PID namespace's PID 1, reports its exit, and serves exec, port connections, and image builds over vsock."

[[bin]]
name = "sandcastle-guest"
path = "src/main.rs"

[dependencies]
sandcastle-wire.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true
tokio.workspace = true
flate2.workspace = true
tar.workspace = true
ruzstd.workspace = true
