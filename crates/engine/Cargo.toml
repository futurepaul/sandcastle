[package]
name = "sandcastle-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A node's microVM engine on libkrun with Cloudflare's container API: it holds the node's VMs, jails each, gives it a cgroup, pulls and builds images, takes snapshots, and runs each VM's egress."

[[bin]]
name = "sandcastle-engine"
path = "src/main.rs"

[dependencies]
sandcastle-wire.workspace = true
sandcastle-vm.workspace = true
sandcastle-rootfs.workspace = true
sandcastle-egress.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
libc.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
