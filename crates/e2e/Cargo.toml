[package]
name = "sandcastle-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The real-engine e2e: a sandcastle node on a KVM host, driven through its API and its URLs, checked on the host over SSH, with machine-readable evidence."
publish = false

[dependencies]
sandcastle-proto.workspace = true
sandcastle-nip98 = { workspace = true, features = ["sign"] }
clap.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
iroh.workspace = true
rand_core.workspace = true
rustls.workspace = true
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
