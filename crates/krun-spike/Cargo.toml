[package]
name = "sandcastle-krun-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The libkrun spike's driver (docs/krun-spike.md): each scenario, its evidence as JSON, and reset. A lower-rung diagnostic, not the product."

[[bin]]
name = "sandcastle-krun-spike"
path = "src/main.rs"

# hermes-trace's sampler, run inside a guest: std and libc only, linked
# static (`RUSTFLAGS="-C target-feature=+crt-static"` with an explicit
# `--target x86_64-unknown-linux-gnu`).
[[bin]]
name = "sandcastle-snoop"
path = "src/bin/snoop.rs"

[dependencies]
sandcastle-wire.workspace = true
sandcastle-vm.workspace = true
sandcastle-rootfs.workspace = true
sandcastle-egress.workspace = true
sandcastle-engine.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
libc.workspace = true
tar.workspace = true
flate2 = { workspace = true, features = ["rust_backend"] }
ruzstd.workspace = true
# the egress scenario's stand-in answers a guest's WebSocket
tokio-tungstenite.workspace = true
futures-util.workspace = true
