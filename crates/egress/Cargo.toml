[package]
name = "sandcastle-egress"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A microVM's egress: the rules (as Cloudflare's: hosts, globs, addresses, ranges; 128 of them), fake addresses for names, a resolver, and the node-side proxy that intercepts TLS with the node's CA and hands a request to a handler or substitutes a placeholder, WebSockets included."

[dependencies]
sandcastle-wire.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true


[dev-dependencies]
# a guest's WebSocket client and the stand-in platform's (tests/websocket.rs)
tokio-tungstenite.workspace = true
futures-util.workspace = true
