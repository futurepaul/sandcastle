[package]
name = "sandcastled"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The sandcastle node daemon: computers on microVMs, a signed API, and one locked-down URL each."

[dependencies]
sandcastle-proto.workspace = true
sandcastle-nip98.workspace = true
clap.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rand_core.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
sandcastle-nip98 = { workspace = true, features = ["sign"] }
rcgen.workspace = true
