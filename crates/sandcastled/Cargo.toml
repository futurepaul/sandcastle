[package]
name = "sandcastled"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The sandcastle node daemon: computers on microVMs, a signed API, and one locked-down URL each."

[dependencies]
sandcastle-core.workspace = true
sandcastle-node.workspace = true
sandcastle-proto.workspace = true
sandcastle-nip98.workspace = true
clap.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
url.workspace = true

[dev-dependencies]
# signing: the tests sign their API calls
sandcastle-nip98 = { workspace = true, features = ["sign"] }
sandcastle-sim = { path = "../sim" }
rcgen.workspace = true
